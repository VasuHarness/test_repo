apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-k8s-iq-deployment
  labels:
    app: resource-test

spec:
  replicas: 2

  selector:
    matchLabels:
      app: resource-test

  template:
    metadata:
      labels:
        app: resource-test

    spec:
      # Pod-level resources: the important part of this test.
      resources:
        requests:
          cpu: "500m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "512Mi"

      containers:
        - name: app
          image: nginx:stable

          # Container-level resources.
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
