
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-workers
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      schedulingGroup:
        podGroupName: ai-training
      containers:
        - name: worker
          image: nginx
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
