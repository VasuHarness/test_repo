
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: certificate-test
  template:
    metadata:
      labels:
        app: certificate-test
    spec:
      containers:
        - name: nginx
          image: nginx
          volumeMounts:
            - name: certificate
              mountPath: /etc/certs
              readOnly: true
      volumes:
        - name: certificate
          projected:
            sources:
              - podCertificate:
                  path: tls.crt
                  signerName: example.com/test-signer
                  keyType: ED25519
                  credentialBundlePath: credentialbundle.pem
                  userAnnotations:
                    example.com/team: platform
                    example.com/environment: dev
